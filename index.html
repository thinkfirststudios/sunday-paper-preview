<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunday Paper</title>
<meta name="description" content="Sunday Paper. The content you consume matters. First drop: Don't Leave Before The Good Part.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================ SPLASH ============================ -->
<!-- Shown on first load at "/". SHOP fades it out and reveals the store underneath. -->
<div class="splash" id="splash" hidden>
  <div class="splash__media" id="splashMedia"></div>
  <!-- Fixed-height wordmark: swap the span for <img src="assets/logo-white.svg" alt="Sunday Paper"> -->
  <p class="splash__mark wordmark" aria-label="Sunday Paper"><span>Sunday Paper</span></p>
  <button class="splash__btn" id="splashShop" type="button">Shop</button>
</div>

<div class="site" id="site">

  <a class="skip-link" href="#view">Skip to content</a>

  <!-- ============================ ANNOUNCEMENT ============================ -->
  <div class="announce">First drop — available now</div>

  <!-- ============================ HEADER ============================ -->
  <header class="header">
    <div class="header__inner">
      <!-- Fixed-height wordmark: swap the span for <img src="assets/logo.svg" alt="Sunday Paper"> -->
      <a class="wordmark header__mark" href="#/shop" aria-label="Sunday Paper — shop"><span>Sunday Paper</span></a>

      <nav class="header__nav" aria-label="Primary">
        <a href="#/shop" data-nav="shop">Shop</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>

      <div class="header__util">
        <button class="text-btn" id="searchToggle" type="button" aria-expanded="false" aria-controls="search">Search</button>
        <button class="text-btn" id="cartToggle" type="button" aria-expanded="false" aria-controls="cart">Cart (<span id="cartCount">0</span>)</button>
      </div>
    </div>

    <!-- search drops down under the header -->
    <div class="search" id="search" hidden>
      <div class="search__inner">
        <label class="visually-hidden" for="searchInput">Search products</label>
        <input class="search__input" type="search" id="searchInput" placeholder="Search" autocomplete="off">
        <button class="text-btn" id="searchClose" type="button">Close</button>
      </div>
      <div class="search__results" id="searchResults" aria-live="polite"></div>
    </div>
  </header>

  <!-- ============================ VIEW ============================ -->
  <main id="view" tabindex="-1"></main>

  <!-- ============================ FOOTER ============================ -->
  <footer class="footer">
    <nav class="footer__links" aria-label="Footer">
      <a href="#/info/shipping">Shipping</a>
      <a href="#/info/returns">Returns</a>
      <a href="#/info/contact">Contact</a>
      <a href="#/info/terms">Terms</a>
      <a href="#/info/privacy">Privacy</a>
      <a href="https://instagram.com/sundaypaper_clo" target="_blank" rel="noopener">Instagram</a>
      <a href="https://tiktok.com/@sundaypaper_co" target="_blank" rel="noopener">TikTok</a>
    </nav>

    <form class="signup" id="signup" novalidate>
      <label class="visually-hidden" for="signupEmail">Email address</label>
      <input type="email" id="signupEmail" placeholder="Email" autocomplete="email" required>
      <button type="submit" aria-label="Sign up">
        <svg viewBox="0 0 24 12" aria-hidden="true"><line x1="0" y1="6" x2="22" y2="6"></line><polyline points="17,1 22,6 17,11"></polyline></svg>
      </button>
    </form>
    <p class="signup__msg" id="signupMsg" role="status"></p>
  </footer>

</div>

<!-- ============================ CART DRAWER ============================ -->
<div class="scrim" id="scrim" hidden></div>
<aside class="cart" id="cart" aria-label="Cart" aria-hidden="true" inert>
  <div class="cart__head">
    <p>Cart (<span id="cartCountDrawer">0</span>)</p>
    <button class="text-btn" id="cartClose" type="button">Close</button>
  </div>
  <div class="cart__items" id="cartItems"></div>
  <div class="cart__foot">
    <div class="cart__row"><span>Subtotal</span><span id="cartSubtotal">$0</span></div>
    <p class="cart__note">Shipping and tax at checkout.</p>
    <button class="btn" id="checkoutBtn" type="button">Checkout</button>
    <p class="cart__msg" id="checkoutMsg" role="status"></p>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
